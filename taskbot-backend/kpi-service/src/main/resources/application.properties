spring.application.name=kpi

oracle.wallet.path=${ORACLE_WALLET_PATH:/app/Wallet}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_WALLET_PATH:/app/Wallet}
spring.datasource.hikari.data-source-properties.TNS_ADMIN=${ORACLE_WALLET_PATH:/app/Wallet}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

springdoc.swagger-ui.url=/v3/api-docs/kpis
