spring.application.name=auth-service

oracle.wallet.path=${ORACLE_WALLET_PATH:/app/Wallet}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_WALLET_PATH:/app/Wallet}
spring.datasource.hikari.data-source-properties.TNS_ADMIN=${ORACLE_WALLET_PATH:/app/Wallet}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

server.port=8082
server.forward-headers-strategy=framework

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs/auth
springdoc.swagger-ui.path=/swagger-ui-auth.html
springdoc.swagger-ui.config-url=/v3/api-docs/auth/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true
