name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            # 1. Navegar al directorio del backend
            cd ${{ secrets.VPS_PROJECT_PATH }}/Backend

            # 2. Actualizar el código
            sudo git pull origin main

            # 3. Tumbar la infraestructura actual
            sudo docker-compose down

            ( cd ai-service       && sudo ./mvnw clean package -DskipTests )
            ( cd ../auth-service     && sudo ./mvnw clean package -DskipTests )
            ( cd ../kpi-service      && sudo ./mvnw clean package -DskipTests )
            ( cd ../task-service     && sudo ./mvnw clean package -DskipTests )
            ( cd ../telegram-service && sudo ./mvnw clean package -DskipTests )

            # 4. Reconstruir y levantar los contenedores backend
            #    Los Dockerfiles compilan el jar internamente (multi-stage),
            #    por eso aquí NO se ejecuta Maven.
            sudo docker-compose up -d --build

            # 5. Compilar y desplegar el Frontend (admindeproyectos)
            #    OJO: confirma esta ruta. Si el frontend esta en otro nivel,
            #    ajustala (p.ej. .../Frontend/admindeproyectos).
            cd ${{ secrets.VPS_PROJECT_PATH }}/admindeproyectos
            sudo git pull origin main
            sudo npm install
            sudo npm run build

            # 6. Desplegar a Apache
            sudo mv ./dist /var/www/html/
