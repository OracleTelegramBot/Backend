name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            # 1. Ir a la raiz del repo y sincronizar al estado de origin/main
            cd ${{ secrets.VPS_PROJECT_PATH }}/Backend
            sudo git fetch origin main
            sudo git reset --hard origin/main

            # 2. Entrar a la carpeta del backend (donde vive docker-compose.yml)
            cd taskbot-backend

            # 3. Tumbar la infraestructura actual
            sudo docker-compose down

            # 4. Compilar los microservicios (los Dockerfiles esperan el jar
            #    ya construido en target/, por eso SI hay que correr Maven).
            #    Cada compilacion va en su propio subshell ( ... ) para que la
            #    ruta no se corrompa si una falla. Con script_stop: true,
            #    cualquier fallo detiene el pipeline.
            ( cd ai-service       && sudo ./mvnw clean package -DskipTests )
            ( cd auth-service     && sudo ./mvnw clean package -DskipTests )
            ( cd kpi-service      && sudo ./mvnw clean package -DskipTests )
            ( cd task-service     && sudo ./mvnw clean package -DskipTests )
            ( cd telegram-service && sudo ./mvnw clean package -DskipTests )

            # 5. Reconstruir y levantar los contenedores backend
            sudo docker-compose up -d --build

            # 6. Compilar y desplegar el Frontend (admindeproyectos)
            cd ${{ secrets.VPS_PROJECT_PATH }}/admindeproyectos
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo npm install
            sudo npm run build

            # 7. Desplegar a Apache
            sudo rm -rf /var/www/html/*
            sudo cp -r ./dist /var/www/html/
