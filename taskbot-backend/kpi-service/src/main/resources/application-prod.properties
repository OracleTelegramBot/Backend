# === HikariCP: NO fail-fast en arranque ===
# Permite que la app arranque aunque la DB esté caída.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000

# === JPA: deferir inicialización del datasource ===
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none

# === Actuator: separar liveness y readiness ===
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true

# Liveness: solo verifica que el proceso Java esté vivo (NO depende de DB)
management.endpoint.health.group.liveness.include=livenessState,ping

# Readiness: SÍ verifica DB (cuando falla, el pod sale del pool de endpoints)
management.endpoint.health.group.readiness.include=readinessState,db
