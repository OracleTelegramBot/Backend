server.port=8084
spring.application.name=task-service

logging.level.dev.sammy_ulfh.task=DEBUG

oracle.wallet.path=${ORACLE_WALLET_PATH:/app/Wallet}

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_WALLET_PATH:/app/Wallet}
spring.datasource.hikari.data-source-properties.TNS_ADMIN=${ORACLE_WALLET_PATH:/app/Wallet}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

kpi.service.url=${KPI_SERVICE_URL:http://kpi-service:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs/task
springdoc.swagger-ui.path=/swagger-ui-task.html
springdoc.swagger-ui.config-url=/v3/api-docs/task/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true
server.servlet.context-path=/
