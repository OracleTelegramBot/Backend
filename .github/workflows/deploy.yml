name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Navegar al directorio del backend
            cd ${{ secrets.VPS_PROJECT_PATH }}/taskbot-backend
            
            # 2. Actualizar el código
            sudo git pull origin main
            
            # 3. Tumbar la infraestructura actual
            sudo docker-compose down
            
            # 4. Compilar los microservicios de Spring Boot (Java)
            # Agrupamos los comandos con && para que si uno falla, se detenga el pipeline
            cd ai-service && sudo ./mvnw clean package && cd ..
            cd auth-service && sudo ./mvnw clean package && cd ..
            cd kpi-service && sudo ./mvnw clean package && cd ..
            cd task-service && sudo ./mvnw clean package && cd ..
            cd telegram-service && sudo ./mvnw clean package && cd ..
            
            # 5. Reconstruir y levantar los contenedores backend
            sudo docker-compose up -d --build
            
            # 6. Compilar y desplegar el Frontend (admindeproyectos)
            cd ../admindeproyectos
            sudo npm install
            sudo npm run build
            
            # 7. Desplegar a Apache (usar cp en lugar de mv)
            sudo cp -r ./dist/* /var/www/html/
