spring.application.name=telegram

feign.client.config.kpi-service.url=${KPI_SERVICE_URL:http://kpi-service:8080}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}

server.port=8081

auth.service.url=${AUTH_SERVICE_URL:http://auth-service:8082}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs/telegram
springdoc.swagger-ui.path=/swagger-ui-telegram.html
springdoc.swagger-ui.config-url=/v3/api-docs/telegram/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true
