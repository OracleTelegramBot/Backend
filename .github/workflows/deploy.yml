name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            # 1. Navegar al directorio del backend
            cd ${{ secrets.VPS_PROJECT_PATH }}/Backend

            # 2. Sincronizar el codigo al estado exacto de origin/main
            #    (fetch + reset evita merge commits y el error de identidad de git)
            sudo git fetch origin main
            sudo git reset --hard origin/main

            # 3. Tumbar la infraestructura actual
            sudo docker-compose down

            # 4. Reconstruir y levantar los contenedores backend
            #    Los Dockerfiles compilan el jar internamente (multi-stage),
            #    por eso aqui NO se ejecuta Maven.
            sudo docker-compose up -d --build

            # 5. Compilar y desplegar el Frontend (admindeproyectos)
            #    OJO: confirma esta ruta si el frontend esta en otro nivel.
            cd ${{ secrets.VPS_PROJECT_PATH }}/admindeproyectos
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo npm install
            sudo npm run build

            # 6. Desplegar a Apache
            #    Limpiar destino y copiar el contenido del build.
            sudo rm -rf /var/www/html/*
            sudo cp -r ./dist/* /var/www/html/
